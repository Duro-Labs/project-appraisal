<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project appraisal</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--muted:#6b6a65;--line:#e4e1d8;--accent:#2f5d8a;--sel:#eef3f8}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--muted:#9a988f;--line:#2c2b28;--accent:#8db4dc;--sel:#1f2a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
main{display:grid;grid-template-columns:minmax(260px,38%) 1fr;height:calc(100vh - 49px)}
@media (max-width:720px){main{grid-template-columns:1fr;height:auto}}
#tree{border-right:1px solid var(--line);overflow:auto;padding:6px 0}
.g{padding:6px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.g:hover,.g.on{background:var(--sel)}
.n{font-variant-numeric:tabular-nums;color:var(--muted)}
#detail{padding:16px;overflow:auto}
h2{margin:0 0 4px;font-size:18px}
table{border-collapse:collapse;width:100%;margin:8px 0}
td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
pre{white-space:pre-wrap;background:var(--sel);padding:10px;border-radius:4px}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
button{cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
header button.active{border-color:var(--accent);color:var(--accent)}
#search{min-width:220px}
textarea{width:100%;min-height:55vh;resize:vertical;font:13px/1.5 ui-monospace,monospace;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px}
.artifact-row{display:block;width:100%;text-align:left;border:0;border-radius:0;padding:7px 16px;cursor:pointer}
.artifact-row:hover,.artifact-row.on{background:var(--sel)}
.artifact-row small{display:block;color:var(--muted);overflow-wrap:anywhere}
.kind{padding:10px 16px 4px;color:var(--muted);font-weight:600;text-transform:capitalize}
.path{overflow-wrap:anywhere}
</style>
</head>
<body>
<header><strong>Project appraisal</strong><button id="tab-sessions" class="active">Sessions</button><button class="tab-kind" data-kind="memory">Memory</button><button class="tab-kind" data-kind="rule">Rules</button><button class="tab-kind" data-kind="skill">Skills</button><button class="tab-kind" data-kind="hook">Hooks</button><input id="search" placeholder="Search names, paths and contents" hidden><span id="sum" class="n"></span></header>
<main><nav id="tree"></nav><section id="detail"><p class="n">Pick a group.</p></section></main>
<script>
const fmt = n => n >= 1e9 ? (n/1e9).toFixed(2)+'B' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : String(n);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = g => g.Name || g.Suggested || g.ID;
let groups = [], byId = {}, current = null;
let tab = 'sessions', kind = 'memory', items = [], selectedArtifact = null, openedArtifact = null, searchTimer;

document.getElementById('tab-sessions').onclick = () => switchTab('sessions');
document.querySelectorAll('.tab-kind').forEach(el => el.onclick = () => { kind = el.dataset.kind; selectedArtifact = null; switchTab('artifacts'); });
document.getElementById('search').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadArtifacts, 180);
};

function switchTab(next) {
  tab = next;
  document.getElementById('tab-sessions').classList.toggle('active', tab === 'sessions');
  document.querySelectorAll('.tab-kind').forEach(el => el.classList.toggle('active', tab === 'artifacts' && el.dataset.kind === kind));
  document.getElementById('search').hidden = tab !== 'artifacts';
  if (tab === 'artifacts') loadArtifacts(); else load();
}

async function load(data) {
  data = data || await (await fetch('/api/groups')).json();
  if (tab !== 'sessions') return;
  groups = data.groups; byId = Object.fromEntries(groups.map(g => [g.ID, g]));
  const total = groups.filter(g => !g.ParentID).reduce((a, g) => a + g.TreeTotal, 0);
  document.getElementById('sum').textContent = `${groups.length} groups · ${fmt(total)} tokens` + (data.stale ? ` · ${data.stale} stale decisions` : '');
  renderTree();
  if (current && byId[current]) show(current);
  else document.getElementById('detail').innerHTML = '<p class="n">Pick a group.</p>';
}

function renderTree() {
  const out = [];
  const walk = (g, depth) => {
    const roots = g.Sessions.filter(s => !s.Child).length;
    out.push(`<div class="g${g.ID === current ? ' on' : ''}" data-id="${esc(g.ID)}" style="padding-left:${16 + depth * 16}px"><span>${esc(label(g))} <span class="n">(${roots})</span></span><span class="n">${fmt(g.TreeTotal)}</span></div>`);
    (g.Children || []).map(id => byId[id]).filter(Boolean).sort((a, b) => b.TreeTotal - a.TreeTotal).forEach(c => walk(c, depth + 1));
  };
  groups.filter(g => !g.ParentID).forEach(g => walk(g, 0));
  const tree = document.getElementById('tree');
  tree.innerHTML = out.join('');
  tree.querySelectorAll('.g').forEach(el => el.onclick = () => { current = el.dataset.id; renderTree(); show(current); });
}

async function decide(list) {
  let data;
  for (const d of list) {
    const r = await fetch('/api/decisions', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(d)});
    if (!r.ok) { alert(await r.text()); await load(); return; }
    data = await r.json();
  }
  if (data) await load(data);
}

function show(id) {
  const g = byId[id], anchor = g.Roots[0], t = g.Totals;
  const others = groups.filter(o => o.ID !== id).sort((a, b) => label(a).localeCompare(label(b)))
    .map(o => `<option value="${esc(o.Roots[0])}">${esc(label(o))}</option>`).join('');
  const models = Object.entries(t.ByModel || {}).sort((a, b) => b[1] - a[1])
    .map(([m, n]) => `<tr><td>${esc(m)}</td><td class="r">${fmt(n)}</td></tr>`).join('');
  const rows = g.Sessions.map(s => `<tr><td>${s.Child ? '' : `<input type="checkbox" value="${esc(s.ID)}">`}</td><td>${s.Child ? '↳ ' : ''}<a href="#" data-s="${esc(s.ID)}">${esc(s.Title || s.ID)}</a></td><td>${esc(s.Provider)}</td><td>${esc((s.Start || '').slice(0, 10))}</td><td class="r">${fmt(s.Tokens)}</td></tr>`).join('');
  document.getElementById('detail').innerHTML = `
    <h2>${esc(label(g))}</h2>
    <p class="n">${esc(g.Scope)} · ${fmt(t.Total)} tokens here, ${fmt(g.TreeTotal)} with nested groups · input ${fmt(t.Input)} · output ${fmt(t.Output)} · cache read ${fmt(t.CacheRead)} · cache write ${fmt(t.CacheWrite)}</p>
    <div class="row"><input id="nm" value="${esc(g.Name)}" placeholder="${esc(g.Suggested)}"><button id="rn">Rename</button></div>
    <div class="row"><select id="tg">${others}</select><button id="mg">Merge into</button><button id="ns">Nest under</button>${g.ParentID ? '<button id="un">Unnest</button>' : ''}</div>
    <table><thead><tr><th></th><th>Session</th><th>Tool</th><th>Started</th><th class="r">Tokens</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="row"><button id="dt">Detach selected</button><button id="ng">Selected → new group</button></div>
    <h3>By model</h3><table>${models}</table>
    <div id="card"></div>`;
  const $ = s => document.getElementById(s);
  const sel = () => [...document.querySelectorAll('#detail input[type=checkbox]:checked')].map(i => i.value);
  $('rn').onclick = () => decide([{Kind: 'name', A: anchor, Name: $('nm').value}]);
  $('mg').onclick = () => $('tg').value && decide([{Kind: 'merge', A: anchor, B: $('tg').value}]);
  $('ns').onclick = () => $('tg').value && decide([{Kind: 'nest', A: anchor, B: $('tg').value}]);
  if ($('un')) $('un').onclick = () => decide([{Kind: 'unnest', A: anchor}]);
  const split = grouped => {
    const s = sel();
    if (!s.length) return;
    const rest = g.Sessions.filter(x => !x.Child).map(x => x.ID).filter(id => !s.includes(id));
    decide([
      ...rest.slice(1).map(r => ({Kind: 'merge', A: rest[0], B: r})),
      ...s.map(a => ({Kind: 'detach', A: a})),
      ...(grouped ? s.slice(1).map(a => ({Kind: 'merge', A: s[0], B: a})) : []),
    ]);
  };
  $('dt').onclick = () => split(false);
  $('ng').onclick = () => split(true);
  document.querySelectorAll('#detail a[data-s]').forEach(a => a.onclick = async e => {
    e.preventDefault();
    const r = await fetch('/api/session?id=' + encodeURIComponent(a.dataset.s));
    if (!r.ok) { $('card').innerHTML = `<p class="n">${esc(r.status === 404 ? 'Session not found' : 'Could not load session')}</p>`; return; }
    const d = await r.json();
    $('card').innerHTML = `<h3>${esc(d.Title || d.ID)}</h3><pre>${esc(d.Card)}</pre>`;
  });
}

async function loadArtifacts() {
  const query = document.getElementById('search').value.trim();
  const r = await fetch('/api/artifacts?q=' + encodeURIComponent(query));
  if (!r.ok) { document.getElementById('detail').textContent = await r.text(); return; }
  const data = await r.json();
  if (tab !== 'artifacts' || query !== document.getElementById('search').value.trim()) return;
  const all = data.items || [];
  items = all.filter(item => item.Kind === kind);
  document.querySelectorAll('.tab-kind').forEach(el => {
    const n = all.filter(item => item.Kind === el.dataset.kind).length;
    el.textContent = el.textContent.replace(/ \(\d+\)$/, '') + ` (${n})`;
  });
  document.getElementById('sum').textContent = `${items.length} matching items`;
  renderArtifacts();
  if (selectedArtifact && items.some(item => item.ID === selectedArtifact)) showArtifact(selectedArtifact);
  else { selectedArtifact = null; openedArtifact = null; document.getElementById('detail').innerHTML = `<p class="n">Pick a ${kind === 'memory' ? 'memory file' : kind}.</p>`; }
}

function renderArtifacts() {
  const tree = document.getElementById('tree');
  const out = [];
  for (const provider of [...new Set(items.map(item => item.Provider))]) {
    const matching = items.filter(item => item.Provider === provider);
    out.push(`<div class="kind">${esc(provider)} (${matching.length})</div>`);
    out.push(...matching.map(item => `<button class="artifact-row${item.ID === selectedArtifact ? ' on' : ''}" data-id="${esc(item.ID)}"><strong>${esc(item.Name)}</strong><small>${esc(item.Provider)} · ${esc(item.Scope)}</small></button>`));
  }
  tree.innerHTML = out.join('') || '<p class="n" style="padding:0 16px">No matching items.</p>';
  tree.querySelectorAll('.artifact-row').forEach(el => el.onclick = () => { selectedArtifact = el.dataset.id; renderArtifacts(); showArtifact(selectedArtifact); });
}

async function showArtifact(id) {
  const r = await fetch('/api/artifact?id=' + encodeURIComponent(id));
  if (!r.ok) { document.getElementById('detail').textContent = await r.text(); return; }
  const data = await r.json();
  if (tab !== 'artifacts' || selectedArtifact !== id) return;
  openedArtifact = data.item;
  const item = data.item;
  document.getElementById('detail').innerHTML = `
    <h2>${esc(item.Name)}</h2>
    <p class="n">${esc(item.Provider)} · ${esc(item.Kind)} · ${esc(item.Scope)} · ${item.Size} bytes</p>
    <p class="path"><code>${esc(item.Path)}</code></p>
    ${item.Error ? `<p class="n">${esc(item.Error)}</p>` : ''}
    <textarea id="artifact-content" ${item.Editable ? '' : 'readonly'}></textarea>
    <div class="row">${item.Editable ? '<button id="save-artifact">Save changes</button>' : '<span class="n">Read-only</span>'}${item.Deletable ? '<button id="delete-artifact">Delete file…</button>' : ''}</div>`;
  document.getElementById('artifact-content').value = data.content;
  const save = document.getElementById('save-artifact');
  if (save) save.onclick = async () => {
    const response = await fetch('/api/artifact', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ID: item.ID, Hash: item.Hash, Content: document.getElementById('artifact-content').value})});
    if (!response.ok) { alert(await response.text()); return; }
    const updated = await response.json();
    openedArtifact = updated.item;
    await loadArtifacts();
  };
  const remove = document.getElementById('delete-artifact');
  if (remove) remove.onclick = async () => {
    if (!confirm(`Delete this file permanently?\n${item.Path}`)) return;
    const response = await fetch('/api/artifact', {method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ID: item.ID, Hash: item.Hash})});
    if (!response.ok) { alert(await response.text()); return; }
    selectedArtifact = null;
    await loadArtifacts();
  };
}

load();
</script>
</body>
</html>
